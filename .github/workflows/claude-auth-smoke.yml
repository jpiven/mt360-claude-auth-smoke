name: Claude OAuth smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: anthropics/claude-code-action@9cdae7f0d995e3ba7c33f226087fdf82a59cd520
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          claude_args: --max-turns 1
          show_full_output: 'false'
          prompt: "Prueba de arranque únicamente. No edites archivos ni crees ramas, commits, comentarios o PR. Responde exactamente: OAUTH_SMOKE_OK."
